<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title description">
  <title id="title">Fire TV Aquarium</title>
  <desc id="description">Offline 4K aquarium screensaver with customizable fish and sea life. No tracking or analytics of any kind.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c0a09"/><stop offset="1" stop-color="#1c1917"/></linearGradient>
    <linearGradient id="water" x2="0" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#background)" stroke="#292524"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="40" y="80" font-size="40" font-weight="700" letter-spacing="-.5" fill="#fff">Fire TV Aquarium</text>
    <text x="40" y="112" font-size="14" fill="#a8a29e">Your own underwater world, right on your TV.</text>
    <g transform="translate(40 132)"><rect width="90" height="22" rx="11" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" opacity="0.8"/><text x="45.0" y="15" font-size="10" font-weight="500" text-anchor="middle" fill="#60a5fa">Native 4K</text></g><g transform="translate(138 132)"><rect width="72" height="22" rx="11" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8" opacity="0.8"/><text x="36.0" y="15" font-size="10" font-weight="500" text-anchor="middle" fill="#4ade80">Offline</text></g><g transform="translate(218 132)"><rect width="112" height="22" rx="11" fill="#1a1a1a" stroke="#a78bfa" stroke-width=".8" opacity="0.8"/><text x="56.0" y="15" font-size="10" font-weight="500" text-anchor="middle" fill="#a78bfa">Custom sea life</text></g><g transform="translate(338 132)"><rect width="76" height="22" rx="11" fill="#1a1a1a" stroke="#fbbf24" stroke-width=".8" opacity="0.8"/><text x="38.0" y="15" font-size="10" font-weight="500" text-anchor="middle" fill="#fbbf24">No ads</text></g>
    <text x="40" y="178" font-size="12" fill="#4ade80">No tracking or analytics of any kind.</text>
  </g>
  <g transform="translate(578 42)">
