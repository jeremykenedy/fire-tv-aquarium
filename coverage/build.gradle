plugins {
    id 'com.android.application' version '8.12.0'
    id 'jacoco'
}

layout.buildDirectory = file('../build/coverage/android')

android {
    namespace 'com.jeremykenedy.firetv.aquarium'
    compileSdk 36
    defaultConfig {
        applicationId 'com.jeremykenedy.firetv.aquarium'
        minSdk 23
        targetSdk 36
    }
    sourceSets {
        main {
            manifest.srcFile '../build/coverage/AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
        }
        test.java.srcDirs = ['../tests']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}

dependencyLocking {
    lockAllConfigurations()
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

tasks.register('coverageReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    executionData fileTree(layout.buildDirectory).include('**/*.exec')
    classDirectories.from fileTree("${layout.buildDirectory.get()}/intermediates/javac/debug/compileDebugJavaWithJavac/classes") {
        exclude '**/R.class', '**/R$*.class', '**/BuildConfig.class'
    }
    sourceDirectories.from files('../src')
    reports {
        xml.required = true
        xml.outputLocation = file('../build/coverage/jacoco.xml')
        html.required = true
        html.outputLocation = file('../build/coverage/java-html')
    }
}
